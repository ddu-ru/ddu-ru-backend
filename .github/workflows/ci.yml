name: CI - Continuous Integration

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'

jobs:
  build:
    name: 🔍 Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📝 Check final newline
        uses: qwrtln/check-final-newline@v1.0.0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: 🔎 Check Docker version
        run: docker version

      - name: 🐳 Set up Docker Compose
        run: docker compose up -d --wait

      - name: 🔨 Build & H2 tests with Gradle
        run: ./gradlew clean build --stacktrace -Duser.language=ko -Duser.country=KR

      - name: 🐬 MySQL 8.4 integration tests
        run: ./gradlew mysqlIntegrationTest --stacktrace -Duser.language=ko -Duser.country=KR

      - name: 📋 Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/test-results/
            build/reports/tests/
          if-no-files-found: warn
          retention-days: 7

      - name: 🛠️ Tear down Docker Compose
        if: always()
        run: docker compose down -v

      - name: ✅ CI Success
        run: echo "✅ All CI checks passed! Ready for merge."
