services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - ddu-ru-network

  app_blue: &app_template
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 40s
    expose:
      - "8080"
    volumes:
      - ddu-ru-app-logs:/app/logs
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
      # RDS 연결 설정
      RDS_ENDPOINT: ${RDS_ENDPOINT}
      RDS_PORT: ${RDS_PORT}
      RDS_USERNAME: ${RDS_USERNAME}
      RDS_PASSWORD: ${RDS_PASSWORD}
      RDS_DATABASE_NAME: ${RDS_DATABASE_NAME}
      DDL_AUTO: ${DDL_AUTO}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      # OAuth 설정
      KAKAO_REST_CLIENT_ID : ${KAKAO_REST_CLIENT_ID}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      # JWT 설정
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      # Redis 설정
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      # AWS S3 설정
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      # CoolSMS 설정
      COOLSMS_API_KEY: ${COOLSMS_API_KEY}
      COOLSMS_API_SECRET: ${COOLSMS_API_SECRET}
      COOLSMS_FROM_NUMBER: ${COOLSMS_FROM_NUMBER}
      # profile 설정
      PROFILE_DEFAULT_IMAGE_URL: ${PROFILE_DEFAULT_IMAGE_URL}

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      retries: 5
      timeout: 10s
      start_period: 60s
    networks:
      - ddu-ru-network

  app_green:
    <<: *app_template

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
      - ./deployment/nginx/certbot/www:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    networks:
      - ddu-ru-network

volumes:
  ddu-ru-app-logs:
  redis-data:
  nginx-logs:

networks:
  ddu-ru-network:
    driver: bridge
