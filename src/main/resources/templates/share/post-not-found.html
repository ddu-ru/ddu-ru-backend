<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>게시글을 찾을 수 없어요 | 뚜르</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f6f7f9;
            color: #1d1f24;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .message {
            width: min(100%, 420px);
            padding: 48px 28px;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 16px 48px rgba(28, 36, 48, 0.10);
            text-align: center;
        }

        .brand {
            margin-bottom: 28px;
            color: #55bfe9;
            font-size: 20px;
            font-weight: 800;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 23px;
        }

        p {
            margin: 0;
            color: #777e8a;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
<main class="message">
    <div class="brand">뚜르</div>
    <h1>게시글을 찾을 수 없어요</h1>
    <p>삭제되었거나 존재하지 않는 게시글입니다.</p>
</main>
</body>
</html>
