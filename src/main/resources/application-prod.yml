spring:
  config:
    activate:
      on-profile: prod
  # Flyway가 classpath:db/migration 스크립트를 먼저 적용
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

  datasource:
    url: jdbc:mysql://${RDS_ENDPOINT}:${RDS_PORT}/${RDS_DATABASE_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database: mysql
    hibernate:
      ddl-auto: ${DDL_AUTO}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  lifecycle:
    timeout-per-shutdown-phase: 30s

jwt:
  expiration: ${JWT_EXPIRATION}

logging:
  level:
    root: info
    com.dduru.gildongmu: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [reqId=%X{requestId:-} ip=%X{clientIp:-} method=%X{method:-} uri=%X{uri:-} userId=%X{userId:-}] %msg%n"

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
